[project]
name = "ootp-ai"
version = "0.1.0"
description = "An AI front office for Out of the Park Baseball — read-only ingestion, warehouse, and advisory staff"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jordan Koch" }]
dependencies = [
    # Runtime dependencies arrive with the source that requires them, never
    # speculatively. These two arrived together with the config layer and the
    # warehouse loader, exactly as this comment used to predict.
    #
    # python-dotenv moved here OUT of the dev group: config.py imports it at
    # runtime, so leaving it dev-only means an installed package cannot read .env.
    "python-dotenv>=1.0",
    # PyMySQL over mysqlclient (C extension, no maintained stubs, needs a Windows
    # build toolchain) and over mysql-connector-python (Oracle GPLv2-with-FOSS-
    # exception, partial inline typing). Pure Python, MIT like this repo, and
    # types-PyMySQL exists — which matters because mypy runs strict over src.
    "PyMySQL>=1.1",
]

# The parser itself still reads OOTP's binaries with the stdlib alone (struct,
# pathlib, tomllib) — that is deliberate, not an oversight. Neither dependency
# above is in the parsing path. See requests/feature-requests/README.md.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # Stubs only. mypy is strict over both src and tests, and an unstubbed driver
    # fails the build at the first import.
    "types-PyMySQL>=1.1",
]

# No `transform` group yet — deliberately. dbt arrives with the first dbt model,
# not before, and its adapter choice is an open question: `dbt-mysql` is capped
# at 1.7.0 and pins `dbt-core~=1.7.0`, four minor versions behind the first-party
# adapters. See ADR 0004 §Notes.

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ootp_ai"]

# ─── Lint & format ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "DTZ",      # naive datetimes — every timestamp here is tz-aware or it is a bug
    "PTH",      # use pathlib
    "RUF",
]
ignore = [
    "E501",     # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ─── Types ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

# ─── Tests ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    # Widened from "install or save" when the warehouse arrived: a test needing a
    # populated MySQL is just as un-runnable in CI as one needing the game, and
    # addopts carries --strict-markers, so inventing a second marker is a hard
    # COLLECTION error — the whole suite fails to collect and presents as a broken
    # repo rather than a missing marker. Widen, never add.
    "gamedata: requires a local OOTP install, save, or warehouse. Excluded from CI; run explicitly with -m gamedata.",
]
