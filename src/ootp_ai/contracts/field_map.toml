category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "`TeamRecord.team_id`. Ascending across the file, unique within a save, and never zero — which is what frees 0 to mean \"no team\" in players.dat. The bronze_team key rests on the uniqueness, and a duplicate would silently merge two clubs."

[[field]]
