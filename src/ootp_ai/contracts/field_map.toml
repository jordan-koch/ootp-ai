note = "The structural-absence trap in the direction that actually bites: sub-league 0 is the American League and it is DROPPED from the record, so a reader that treats \"absent\" as \"unknown\" loses half of baseball. Because a written value is therefore always exactly 1, the field also eliminates every wrong reading of a four- or five-value run."

[[field]]
name = "team_nation_id"
source = "teams.dat"
