category = "structural"
epistemic = "measured"
validator = "inverse-model-reproduces-every-record"
note = "`TeamRecord.colors`. Load-bearing structurally before it is interesting visually: colours are never zero, so they are never dropped, and three of them in a row is the specific signature that lets the walk decide how many strings and how many integers the record carried. WHICH of the three is primary, secondary or trim is `unconfirmed` and nothing renders them — bronze lands them as `color_1..color_3` in file order rather than inventing names for slots nobody has read."

[[field]]
name = "team_city_id"
