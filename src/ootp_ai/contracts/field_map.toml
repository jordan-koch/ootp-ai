# ── world.dat, the division nest and the league calendar (Phase 8a backfill) ──
#
# Landed in Phase 5b and declared here in Phase 8a. The entry point is the thing to
# understand before the fields: `world.dat` is ~8.7 MB, its header declares ONE record,
# and the leagues sit 62% in behind a ~94,000-entry city array. So the walk enters by
# searching the buffer for content, validating what it finds by parsing forward, and
# REFUSING unless the answer is unique — never by seeking to an offset. Zero matches and
# two matches are both errors: a landmark walk that finds nothing would otherwise hand
# back a world with no divisions and no calendar, structurally indistinguishable from a
# league that genuinely has neither.

[[field]]
name = "world_declared_record_count"
source = "world.dat"
walker = "ootp_ai.parser.world.read_world"
type = "u32, header tail field 5"
category = "structural"
epistemic = "measured"
validator = "declared-count-equals-parsed-count"
note = "Reads 1 in all three saves — the world is a single record. Which is exactly why this file's byte accounting is `region-accounted` and not `strict`: there is no top-level record count to check a full walk against, so each walked REGION audits itself (declared count equals parsed count, zero residual inside the region) and the un-walked prefix and suffix are recorded as byte counts rather than pretended away."

[[field]]
name = "world_landmark_entry"
source = "world.dat"
walker = "ootp_ai.parser.world.read_world"
type = "structural finding: composite length-prefixed string landmarks, plus a structural search for the calendar"
category = "structural"
epistemic = "measured"
validator = "unambiguous-landmark-or-refuse"
note = "PREFIX AND PAYLOAD TOGETHER, never the payload alone: bare `OPENING DAY` occurs 95 times per save, and the length prefix is what turns a string into a landmark. The league record is found by `<u32 21>Major League Baseball` (1 occurrence per save) and the sub-league nest by a bounded backward scan validated by parsing the whole nest. The calendar could not use a string at all — the schedule in front of it is count-prefixed with a per-league game count that differs between saves — so it is found by what it IS: a count followed by exactly that many decoding records, maximal in BOTH directions. Left-maximality is the half that matters: without it each save yields two survivors, because a calendar record's own tail reads as a count of 1."

[[field]]
name = "world_league_head"
source = "world.dat"
walker = "ootp_ai.parser.world.read_world"
type = "u32 league_id, u32 nation_id, u32 language_id, u32 gender"
category = "structural"
epistemic = "measured"
validator = "export-exact-single-row"
note = "203 / 206 / 0 / 0, matching the export's `leagues` row for MLB field for field. NOT scored across rows, and deliberately not called verified for that reason: this walk reaches ONE league's nest — the one named `Major League Baseball` — because the other fourteen each sit behind their own unmapped scalar block. A league dimension is therefore not landed by anything in this slice."

[[field]]
name = "division_league_id"
source = "world.dat"
walker = "ootp_ai.parser.world.read_world"
type = "u32, from the league → sub_league → division nest"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-divisions"

[[field]]
name = "division_sub_league_id"
source = "world.dat"
walker = "ootp_ai.parser.world.read_world"
type = "u32, from the nest"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-divisions"

[[field]]
name = "division_id"
source = "world.dat"
walker = "ootp_ai.parser.world.read_world"
type = "u32, from the nest"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-divisions"
note = "The file writes membership from the DIVISION's side — a u32 count then explicit team ids — while the export writes it from the club's side as a `division_id` column. Neither was derived from the other, which is what makes their agreement on all six MLB divisions in all three saves worth something."

[[field]]
name = "division_team_id"
source = "world.dat"
walker = "ootp_ai.parser.world.read_world"
type = "u32 array, count-prefixed, one entry per club in the division"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-divisions"
note = "`teams.division_id` is derived from THIS in silver and never parsed: `teams.dat` does not carry it (measured, 0 of 140 on the clubs with a non-zero one), so a division stamped onto a team record could only have come from a join, and bronze does not join. Clubs no division names are structurally absent, not division zero — the four All-Star sides appear in no array, and their export `sub_league_id`/`division_id` of 0 is the export rendering absence as zero, a live instance of the trap. This is also what tightens the managed league's top-level count from 34 records to 30 real clubs."

[[field]]
name = "calendar_seq"
source = "world.dat"
