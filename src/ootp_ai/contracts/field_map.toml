type = "u8 flag, landed as an integer"
category = "structural"
epistemic = "verified"
validator = "export-exact-all-events"
note = "DELETED IS NOT \"PAST\". 2,492 of 3,058 carry it in the probes and 2,259 in the managed league, and deleted MLB rows are dated AFTER the sim date — the set includes a duplicate OPENING DAY and three PLAYOFFS BEGIN. Every row lands and filtering belongs to the report: a walk that dropped them would return 566 rows and look perfectly consistent. It is also the only thing the two universes disagree about in this region — the managed save differs from the probes in exactly 233 bytes, every one of them this flag."

[[field]]
name = "calendar_needs_human_action"
source = "world.dat"
walker = "ootp_ai.parser.world.read_calendar"
type = "u8 flag, landed as an integer"
category = "structural"
epistemic = "verified"
validator = "export-exact-all-events"
note = "The game's own answer to which dates the front office must show up for, which ADR 0013 currently answers by our judgment alone. 112 entries carry it in every save; three survive undeleted in the probes and TEN in the managed league, which still holds live duplicate Trading Deadlines and Rule 5 Drafts. Landed as a datum; no doctrine is built on it in this slice."

[[field]]
name = "calendar_real_sim_date"
source = "world.dat"
walker = "ootp_ai.parser.world.read_calendar"
type = "u16, last field of each event"
category = "structural"
epistemic = "unconfirmed"
validator = "none"
note = "CORRECTED at the Phase 8a acceptance panel, which caught this labelled `verified` — the one wrong label in the file that built the loader to prevent wrong labels. The value matches the export on all 3,058 rows, but BOTH SIDES ARE ZERO on every row of every save, so `export-exact-all-events` discriminates nothing here: a parser reading an adjacent zero u16 scores identically. `parser/world.py` says the same thing outright — the meaning is `unconfirmed`, measured 0 everywhere, so nothing can say what a non-zero one would mean — and reviews/handoff-phase-5b.md proposed exactly this label. Crossed and landed raw. What would settle it is a mid-season save with a partially-simulated calendar. This is also the file's FIRST field on the uncertainty path: it renders only through `render_with_uncertainty`, under a banner, never as a bare column."

[[field]]
name = "calendar_flag_typing"
source = "world.dat"
walker = "ootp_ai.parser.world.read_calendar"
type = "structural decision, not a field: the three u8 flags land as int, never bool"
category = "structural"
epistemic = "measured"
validator = "export-exact-all-events"
note = "Every observed value is 0 or 1, and *observed* is doing real work in that sentence: `bool(2)` is `True`, so a boolean column would make an unexpected value indistinguishable from a 1 forever. Bronze is 1:1 with parser output — typing and casing, no semantic conversion — so `bronze_league_event` declares these `bool01`, a 0/1 integer, and a gamedata test checks the domain against the real files. The day the game writes something else it arrives as a red test rather than as a `True` that used to be a 2."

# ── human_managers.dat, the one field a declared column depends on ───────────
#
# 835 bytes that name the club we manage, and the only file in a save that gives an ID
# rather than a display string. Only the club id is declared here, because only the club
# id feeds a declared column (`ingest_run.human_team_id`). The rest of the record — the
# manager's own identity, the drop-zero scalar run — is parsed but undeclared, which is
# what `[meta].incomplete` now says out loud.

[[field]]
name = "human_manager_team_id"
source = "human_managers.dat"
walker = "ootp_ai.parser.human_managers.read_human_manager"
type = "u32, first of three consecutive identical slots at a measured-unique landmark"
category = "identity"
epistemic = "inferred"
validator = "export-exact-single-row"
note = "`inferred` and not higher, for a reason the walker states: the file holds THREE consecutive u32s all carrying the managed club, byte-identical in every save on disk (4/4/4, 4/4/4, 6/6/6), and the export's column list has `team_id`, `last_team_id` and `organization_id` as separate integers. No oracle here can say which slot is which. The walk takes the FIRST — the one the drop-zero field order puts first, and the reading that stays correct when the three diverge, since the other two are the ones that legitimately can. The landmark requires all three to agree, so the divergence that would break the inference makes the parser raise rather than lie. Cross-checked against `teams.dat`'s human flag on all three saves; `None` means the file was absent from the snapshot, which is a known gap and never a zero."

# ── deliberately NOT landed ──────────────────────────────────────────────────
#
# Recorded because their absence is a decision, not an oversight. A later reader
# otherwise has no way to tell "nobody got to it" from "this was refused".

[[withheld]]
name = "ratings"
source = "players.dat"
reason = """ADR 0012, permanent. Two lossy transforms sit between a stored rating and any display — scale conversion and scout filtering — so matching a displayed value to a byte identifies the wrong field with no error surfaced. This slice lands no ratings whatever the Phase 2 spike returned.

DECISIONS §8, RECORDED HERE SO THE NEXT SLICE INHERITS IT RATHER THAN RE-DERIVING IT: when ratings are eventually landed and rendered, **they render at the 20-80 player-page scale**. The engine stores roughly 1-1000, the player page shows 20-80 and in-game reports show 1-100, and the three are not interchangeable — a report that mixes them produces numbers that are individually plausible and mutually meaningless. The storage value is what lands; the conversion belongs to the report layer, once, at the moment of rendering, and 20-80 is the target because it is the scale the operator sees on the screen they would check us against."""

[[withheld]]
name = "position, role"
source = "players.dat"
reason = "Not refused — not yet EXACTLY readable, and landed at less than exact they would be the 97-99% failure this project cannot afford. Measured 2026-08-18, so the next attempt starts here and not at zero: they sit past the historical strings, beyond a 13-byte mostly-zero span, the prone_overall/leg/back/arm quad (byte-exact at that spot on all 18,072 rows), and a flag-byte region (five zeros, then bytes at prone+5/+6/+8/+11/+12 drawn from small sets) that governs a variable-width piece. Within fixed-shape groups keyed on those flag bytes the role byte is EXACT at a group-specific offset — 2,872/2,872, 371/371, 317/317 in the three clean groups — but the shape rule is underived, a fixed offset scores ~50% overall, and hsc_status sits beside role in the one group mapped (2,872/2,872). Two structural warnings for the next session: the export's role=13 (closer) is NOT stored in the role byte — the save holds 12 there for 197 of 229 closers, so 13 looks derived from depth-chart data elsewhere, and export-exact role may be impossible from players.dat alone; and 0xfa bytes recur through the region (rating values of 250), so anchoring on the byte before role fails at ~45%. For pitchers, position is derivable as 1 from role != 0, but deriving is what the plan forbids."
