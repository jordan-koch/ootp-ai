category = "identity"
epistemic = "measured"
validator = "none"
note = "The franchise code, and the walk stops here. Not carried by the export's `teams` table, so it has no independent answer key and is not claimed as verified. Like the player-level `historical_id` it is a NULLABLE ATTRIBUTE and never a join key."

[[field]]
name = "team_pre_colour_run"
source = "teams.dat"
walker = "ootp_ai.parser.teams.read_teams"
type = "structural finding, not a field: [city_id, park_id, league_id, sub_league_id, nation_id, human] with falsy values omitted"
category = "structural"
epistemic = "measured"
validator = "inverse-model-reproduces-every-record"
note = "The model that makes the six fields above readable at all, and the reason a fixed-offset reader is wrong here while looking right on Boston. It reproduces 259 of 259 records in two independent saves; the EXPORT'S OWN COLUMN ORDER scores 0 of 259. A record that survives no reading, or more than one, raises `AmbiguousTeamRecord` rather than guessing — measured, exactly two records per save need the tie-break against the file's own unambiguous records, and they are the National League All-Star sides."

[[field]]
name = "team_string_signature"
source = "teams.dat"
walker = "ootp_ai.parser.teams.read_teams"
type = "structural finding: five length-prefixed strings, slots 1 and 4 droppable"
category = "structural"
epistemic = "measured"
validator = "inverse-model-reproduces-every-record"
note = "`docs/data-access.md` records a five-string signature as verified; measured, it is five strings WHEN ALL FIVE ARE NON-EMPTY. The walk determines the count by parsing forward and requiring the rest of the record to validate — three colours are a very specific signature — then assigns slots by asking whether the third string is an asset filename."

[[field]]
name = "team_organisation_links"
source = "teams.dat"
walker = "ootp_ai.parser.teams.read_teams"
type = "drop-zero u32 array of team ids"
category = "structural"
epistemic = "measured"
