source = "teams.dat"
walker = "ootp_ai.parser.teams.read_teams"
type = "u32 in the drop-zero pre-colour run"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "Never zero — every club has a ballpark, 259 of 259 in the export, range 1..198 — so it is always written. That fact and the same one about `league_id` are what pin the run's spine and make the drop-zero encoding invertible at all."

[[field]]
name = "team_league_id"
source = "teams.dat"
walker = "ootp_ai.parser.teams.read_teams"
type = "u32 in the drop-zero pre-colour run"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
