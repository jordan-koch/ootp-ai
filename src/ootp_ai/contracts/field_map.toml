type = "u32, first field of each event"
category = "identity"
epistemic = "measured"
validator = "declared-count-equals-parsed-count"
note = "THE KEY, and the export does not expose it — which is why the grain had to be settled from the bytes rather than from the answer key. Unique across all 3,058 entries and strictly increasing, which the array's structural search relies on. The readable alternative `(league_id, start_date, event_type, name)` collapses 3,058 rows to 2,600: 458 events lost with nothing raised."

