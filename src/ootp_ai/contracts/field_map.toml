# Field map — what each landed field is, where it came from, and how well we know it.
#
# TRACKED, and legitimately so: a field map we computed is our observation, not Out of
# the Park Developments' data (ADR 0006, and `.claude/agents/data-engineer.md`: "A
# field-offset map you computed is ours and is tracked. A copy of players.csv is Out of
# the Park Developments' and is not").
#
# ── ADR 0006, an individual name string as structural evidence ────────────────
#
# RULED 2026-08-18 by the operator, at the first occasion the question arose (Phase 7,
# names.dat). An INDIVIDUAL name string from OOTP's shipped name master, used as
# STRUCTURAL EVIDENCE for a format finding, falls inside ADR 0006's derived-knowledge
# carve-out and may be tracked. A slice of the table does not, at any size.
#
# The distinction is what the string is doing. "'t Hart" appears in tests/test_parse_names.py
# and in parser/names.py's docstring because it IS the finding: a real surname whose first
# character is an apostrophe (0x27) is the exact collision that refutes reading that byte
# as a record separator, and without it the finding is unreproducible prose — a reader
# cannot check it against the shipped file. That is the same kind of artifact as a byte
# offset we measured. A LOOKUP — a mapping from an identifier to a name, in any form,
# under any filename — is the thing that stays out, and Phase 7's Tier-A test therefore
# holds no name data at all: it reads both sides at runtime and compares them to each
# other. `tests/test_no_leaks.py` catches players.csv by FILENAME only, so a renamed
# derived copy would sail through; that guard is not what makes this safe, this rule is.
#
# Note this file itself carries NO name strings — only counts, offsets and block
# boundaries.
#
# Phase 8a completed the `teams.dat` and `world.dat` backfills this file used to declare
# as outstanding, so `[meta].incomplete` is now empty. What remains undecoded is inside
# `players.dat`, and it is named rather than hidden: the record is described below through
# the identity tail (the two historical strings, roughly record+70..100), and the rest —
# including position and role — is undecoded, with the final [[withheld]] entry recording
# how far the decode got and where it breaks.
#
# **This file is now READ, and validated.** `contracts/loader.py` parses it, and every
# `category`, `epistemic` and `validator` value below must be a member of the [vocabulary]
# declared further down — an unknown value raises, naming the field and the value. Until
# Phase 8a that check did not exist and a `verified` pasted from the row above would have
# shipped green; the labels here carry ADR 0012's withhold rule, so they had to stop being
# unenforced prose. `contracts/policy.py` is the gate that consumes them.
#
# ── the vocabulary ───────────────────────────────────────────────────────────
#
# category   identity | rating-true | rating-scouted | contract | structural
#            An UNCLASSIFIED field is recorded `rating-true`, not "unknown". That is the
#            withhold-by-default posture ADR 0012 requires: "probably fine" is not a
#            classification, and the cost of guessing wrong on a rating is a confidently
#            wrong recommendation with nothing raised.
#
# epistemic  measured | verified | inferred | assumed | unconfirmed
#            `verified` here means scored against EVERY row of an independent answer key
#            and matching exactly — not sampled, not spot-checked.
#
# validator  which check produced the label, so a reader can re-run it.

[meta]
schema_version = 1
updated = "2026-08-19"
phase = "first-sight Phase 8a (contracts, DDL, and the offline grain guards)"
covers = ["players.dat", "teams.dat", "names.dat", "world.dat", "human_managers.dat (club id only)"]
# CORRECTED at the Phase 8a panel, which caught this as an empty list. Two files ARE
# parsed and have no field entries here, and one of them feeds a declared column, so
# `incomplete = []` was an overclaim in the very key that exists to prevent one. The rule
# this key now states: a file appears here when the walker reads fields this map does not
# declare — not when the file is unread.
incomplete = ["human_managers.dat (everything but the club id)", "saved_games.dat"]

# The vocabulary above, in machine-readable form. `contracts/loader.py` checks every entry
# against these three lists and refuses an unknown value by name — which is the whole
# reason this section exists rather than staying a comment. A typo in a label is otherwise
# invisible: it lints clean, it parses clean, and it silently reclassifies a field that
# ADR 0012's withhold rule depends on.
[vocabulary]
category = ["identity", "rating-true", "rating-scouted", "contract", "structural"]
epistemic = ["measured", "verified", "inferred", "assumed", "unconfirmed"]
validator = [
    "none",
    "export-exact-all-rows",
    "export-exact-all-divisions",
    "export-exact-all-events",
    "export-exact-single-row",
    "export-exact-magnitude-all-rows",
    "export-presence-all-rows",
    "cross-save-comparison",
    "cross-save-parse-zero-refusals",
    "multiset-equality-all-clubs",
    "cross-check-vs-multiplicity-solve",
    "population-exact",
    "signature-match-or-refuse",
    "fixed-width-implied-by-exact-bit-match",
    "framed-count-equals-declared",
    "declared-count-equals-parsed-count",
    "no-module-level-cache",
    "unambiguous-landmark-or-refuse",
    "inverse-model-reproduces-every-record",
    "mutual-link-agreement",
]

# ── players.dat, the fixed head ──────────────────────────────────────────────
#
# Every `verified` row below was scored against all 18,072 `retired = 0` rows of
# `ootp_truth_real.players` and matched exactly. Evidence:
# `tests/test_parse_players.py::test_every_landed_field_matches_the_export_exactly`.

[[field]]
name = "player_id"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u32"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "Ascending across the file. OOTP's internal key, and the one that covers every player — unlike historical_id, which covers ~10.6%."

[[field]]
name = "first_name_index"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u32"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "The u32 at record+4. Resolved by brute force in Phase 7, not by reading bytes: scored across all 18,072 export rows, +4-as-first/+8-as-last matched 18,072/18,072 = 100.00% while the opposite assignment scored 1/18,072 = 0.01%, with zero unresolved indices either way. An index into names.dat and meaningless without a NameTable built from the SAME save."

[[field]]
name = "last_name_index"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u32"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "The u32 at record+8, verified by the same scoring run as first_name_index."

[[field]]
name = "date_of_birth"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "date (u8 day, u8 month, u16 year)"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "Load-bearing beyond its own value: the walk frames records by requiring this to agree with the age byte and the file's sim date."

[[field]]
name = "age"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u8"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "Stored, not derived — but measured to equal the whole years between date_of_birth and the sim date for all 18,072 records, with zero exceptions. That invariant is what makes record framing exact."

[[field]]
name = "nation_id"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u8"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"

[[field]]
name = "city_of_birth_id"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u32"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "1,140 distinct values across the sample, which is what makes a 100% match meaningful rather than a coincidence of low cardinality."

[[field]]
name = "weight"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u16"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"

[[field]]
name = "height"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u8"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"

[[field]]
name = "uniform_number"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u8"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "The plan's §2.5 example of a field neither scale-converted nor scout-filtered: 34 on the screen is 34 in the bytes."

[[field]]
name = "experience"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u8"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"

[[field]]
name = "content_digest"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "string (u32 length + ASCII)"
category = "structural"
epistemic = "measured"
validator = "cross-save-comparison"
note = "A 64-character hex digest in the file preamble. Measured 2026-08-18: all three saves carry DISTINCT digests, and the two test saves agree on exactly the first 32 hex characters before diverging. Corrected — an earlier note claimed the test saves shared one digest, which came from comparing the first twelve characters of a debug print rather than the string. What the 32/32 split means is `unconfirmed`. Not a game fact; a property of the file."

# ── club assignment, from the presence mask at record+55 ─────────────────────
#
# Six `u32` fields written in bit order with absent ones skipped, each paired with its
# `last_` counterpart. `verified` against every `retired = 0` export row. An absent field
# means the value IS zero — the writer elides falsy values — so these land as 0, never
# NULL. Reads are signed: the export carries negatives here, and an unsigned read would
# turn -1 into 4,294,967,295, which looks like an id.

[[field]]
name = "team_id"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "i32 (presence bit 0)"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "The club the player is assigned to. NOT the roster grain — team_roster is a separate membership store in teams.dat, and deriving list 1 from this column differs by 176 rows."

[[field]]
name = "last_team_id"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "i32 (presence bit 1)"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "Immediately precedes team_id in the written order, which is what made the drop-zero rule visible: a player who never changed clubs has this zero, it is elided, and team_id lands four bytes earlier."

[[field]]
name = "organization_id"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "i32 (presence bit 2)"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "The parent club. Differs from team_id for a prospect assigned to an affiliate, which is the cross-team fan-out the roster grain has to honour."

[[field]]
name = "last_organization_id"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "i32 (presence bit 3)"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"

[[field]]
name = "league_id"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "i32 (presence bit 4)"
category = "identity"
epistemic = "verified"
validator = "export-exact-magnitude-all-rows"
note = "MAGNITUDE verified on all 18,072; the export writes this NEGATIVE on exactly 176 records where the save stores it positive. The parser reports what the bytes hold. Those 176 are precisely the players with a team_id and no list_id=1 roster row, so the sign appears to mark attached-but-not-rostered — `inferred`. A consumer wanting the export's convention must apply it deliberately."

[[field]]
name = "last_league_id"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "i32 (presence bit 5)"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"

[[field]]
name = "free_agent"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "bit 0 of the second mask at record+56"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "A boolean carried entirely by its presence bit — under drop-zero a false boolean is simply not written, so the bit IS the value."

# ── the identity tail, from the masks at record+56 and record+57 ─────────────
#
# Decoded 2026-08-18. The second mask's bits 2-7 govern six optional fields written in
# ascending bit order (nickname index u32, second_nation_id u32, language_ids0 u16,
# language_ids1 u16, bats u8, throws u8), the third mask's bit 2 governs one
# unclassified u8 and bit 5 a loan u32, and then two u32-length-prefixed strings follow
# back to back: historical_id and historical_team_id. Every claim below was scored
# against ALL 18,072 `retired = 0` export rows, and the same structural rule accepts
# every record of all three saves (18,077 + 18,077 + 22,046, zero refusals) — see
# PlayersFile.undecoded_tails. The walk validates the whole tail by lookahead before
# consuming any of it; a record that fails lands bats/throws/historical_id as None
# (tail unreadable), which is distinct from "" (structurally absent historical_id).

[[field]]
name = "bats"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u8 (presence bit 6 of the mask at record+56)"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "1 = right, 2 = left, 3 = switch. Drop-DEFAULT, not drop-zero: never zero, and the writer elides the majority value 1 instead — bit set means the byte holds 2 or 3, bit clear means the value IS 1. Absent-means-1 reproduces the export on all 18,072 rows, and the bit-set population equals the not-1 population exactly in all three saves. A drop-zero scorer can never find this field, which is why it survived the Phase 6a sweep."

[[field]]
name = "throws"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u8 (presence bit 7 of the mask at record+56)"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "1 = right, 2 = left. Same drop-default encoding as bats; a written byte is always 2 across all three saves."

[[field]]
name = "historical_id"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "string (u32 length + ASCII), first of two after the tail run"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "The Lahman/BBRef string join key (e.g. 'deverra01') — AC8's Tier-A anchor. Exact on all 18,072 export rows INCLUDING the empty ones: a fictional player carries a zero-length prefix, not an absent field, so '' is structural absence and never NULL-by-accident. Coverage 1,920 of 18,072 on the probe export and 2,137 of 22,046 on the managed league, all distinct, all Lahman-shaped — an attribute, never a join key in a serving path. The docs' earlier '~1,712 unique' undercounted. A second occurrence sits ~300-450 bytes deeper in the record and is not read."

# ── crossed, classified, and deliberately not exposed ────────────────────────
#
# The walk must decode these to reach historical_id — their widths are what the masks
# govern — but PlayerRecord does not carry them: every exposed field is a maintenance
# liability somebody re-validates after a game patch, and nothing in this phase needs
# them. The classifications are recorded so the verification is not lost.

[[field]]
name = "nickname_index"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u32 (presence bit 2 of the mask at record+56)"
category = "identity"
epistemic = "verified"
validator = "export-presence-all-rows"
note = "Crossed, not exposed. Present exactly when the export's nick_name is nonempty — 18,072/18,072 — and every observed value sits inside names.dat's ~264,095-entry range (255,215 / 256,259 / 255,826 sampled). That it is a names.dat INDEX is `inferred` until Phase 7 resolves the name table; the presence rule is what is verified."

[[field]]
name = "second_nation_id"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u32 (presence bit 3 of the mask at record+56)"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "Crossed, not exposed. Written BEFORE the language pair despite the export's column order — ascending bit order is the disk order. Misordering these scored 17,899/18,072 with the 173 failures exactly the records carrying both, which is the 99%-fit trap in miniature."

[[field]]
name = "language_ids0"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u16 (presence bit 4 of the mask at record+56)"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "Crossed, not exposed. Elided when the export holds 0."

[[field]]
name = "language_ids1"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u16 (presence bit 5 of the mask at record+56)"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "Crossed, not exposed. Elided when the export holds -1, NOT 0 — 0 is a real language id here and is written. Compared as unsigned low 16 bits."

[[field]]
name = "tail_extra_byte"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u8 (presence bit 2 of the mask at record+57)"
category = "rating-true"
epistemic = "unconfirmed"
validator = "none"
note = "Crossed, withheld. Takes 1, 2 or 3 (overwhelmingly 2), present on ~6% of records — 1,045 of the probe's 1,874 parseable real players but only 61 fictional ones, so it tracks the real-player minority. No players-table column matches it under identity, minus-one or role-remap transforms; whatever it is, it is not in the export's players table."

[[field]]
name = "loan_league_id"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u32 (presence bit 5 of the mask at record+57)"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "Crossed, not exposed. Matches the export on all 18,072 rows (nonzero on 3). loan_team_id was 0 for every loaned player in every save measured, so whether a second u32 appears when it is nonzero is UNOBSERVED — if it does, the tail validation refuses those records loudly rather than misreading them."

[[field]]
name = "historical_team_id"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "string (u32 length + ASCII), second of two after the tail run"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "Crossed, not exposed. Exact on all 18,072 rows (nonempty on 161). Consumed only so the cursor leaves the decoded region on a field boundary."

# ── crossed but not classified ───────────────────────────────────────────────
#
# Bytes the walk consumes inside the fixed head and does not interpret. Recorded as
# `rating-true` / `unconfirmed` per the withhold-by-default rule, so that if any of them
# turns out to be a rating it is already being withheld rather than already shipped.

[[field]]
name = "unclassified_after_birth_date"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "3 bytes"
category = "rating-true"
epistemic = "unconfirmed"
validator = "none"
note = "record+16..+18. Zero in every record inspected."

[[field]]
name = "unclassified_after_age"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "1 byte"
category = "rating-true"
epistemic = "unconfirmed"
validator = "none"
note = "record+20."

[[field]]
name = "unclassified_after_nation"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "5 bytes"
category = "rating-true"
epistemic = "unconfirmed"
validator = "none"
note = "record+22..+26. The widest unclassified span in the head."

[[field]]
name = "unclassified_after_height"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "1 byte"
category = "rating-true"
epistemic = "unconfirmed"
validator = "none"
note = "record+34."

[[field]]
name = "unclassified_after_experience"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "14 bytes"
category = "rating-true"
epistemic = "unconfirmed"
validator = "none"
note = "record+37..+50. High-entropy values in the 60-200 range — personality and injury-proneness territory on the evidence of the export's column list, which is exactly why they are categorised rating-true and withheld rather than left as 'unknown'."

[[field]]
name = "unclassified_before_masks"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "u32"
category = "rating-true"
epistemic = "unconfirmed"
validator = "none"
note = "record+51. **Not a constant, and this one nearly went wrong.** It reads 203 for every one of the 18,077 records in BOTH test saves — a textbook format constant — while the managed league carries six distinct values. Asserting 203 would have passed every available test and broken on the only save that matters. Vary the save before believing a constant."

[[field]]
name = "tail_mask"
source = "players.dat"
walker = "ootp_ai.parser.players.read_players"
type = "1 byte (bitmask)"
category = "structural"
epistemic = "measured"
validator = "cross-save-parse-zero-refusals"
note = "record+57 — formerly 'unclassified_before_assignments', now decoded as a third presence mask: its observed values (2, 6, 14, 34, 38) decompose exactly on bits. Bit 1 is set on all 58,200 records of all three saves (meaning unknown; required as a sentinel so a format change degrades loudly). Bit 2 governs tail_extra_byte, bit 5 the loan u32, bit 3 governs NO bytes (proven by the strings behind it parsing exactly), and bits 0/4/6/7 have never been observed — any of them fails the tail scan."

# ── the roster-membership grain (rosters.py, two files at once) ──────────────
#
# `team_roster`'s (team_id, player_id, list_id) triple, reconstructed from stored
# per-player status bits in players.dat cross-checked against the membership array in
# each teams.dat record. `ootp_ai.parser.rosters` owns the full argument for why the
# array's ORDER cannot carry the list assignment (measured: identical rosters serialize
# in different orders across the two test saves) and why the multiplicity is still
# load-bearing (the managed save carries 154 rostered-but-inactive minor leaguers no
# per-player bit distinguishes). These are the first teams.dat entries in this file,
# ahead of the Phase 8 backfill of that walker's own fields.

[[field]]
name = "roster_membership"
source = "teams.dat + players.dat"
walker = "ootp_ai.parser.rosters.read_rosters"
type = "(team_id, player_id, list_id) rows; list_id 1=assignment 2=active 3=secondary 4=injured"
category = "structural"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "Reproduces ootp_truth_real.team_roster exactly — all 15,672 rows, no extras, no misses — and per-club array reconciliation runs clean on all three saves (229 + 229 + 299 clubs). List 3 rows land at the player's organization_id (verified 935/935), which is how one player spans two clubs. The enum semantics are the operator-verified reading in reviews/list-id-semantics.md."

[[field]]
name = "team_membership_array"
source = "teams.dat"
walker = "ootp_ai.parser.rosters.read_rosters"
type = "contiguous stride-4 u32 array of player ids, in the record's undecoded body (~record+1150..1520, moves per team)"
category = "structural"
epistemic = "measured"
validator = "multiset-equality-all-clubs"
note = "Its MULTISET equals the club's roster rows plus one entry per assigned-but-unrostered player, on every club of every save measured. Its ORDER is container noise: the two test saves hold identical Boston rosters in different orders (88/97 slots agree, the rest permute in local cycles), so no positional decode exists — consumed as a multiset only. Bounded by the club's finance block before and its coaching-staff id array after."

[[field]]
name = "roster_status_injured"
source = "players.dat"
walker = "ootp_ai.parser.rosters.read_rosters"
type = "bit 4 of the status byte 22 bytes past historical_team_id"
category = "structural"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "Equals the export's 330 list_id=4 rows exactly, 18,072/18,072. The only membership evidence for 2-vs-4 at minor-league clubs, where no redundant storage exists to cross-check it — flagged in the walker's docstring."

[[field]]
name = "roster_status_secondary"
source = "players.dat"
walker = "ootp_ai.parser.rosters.read_rosters"
type = "bit 3 of the status byte"
category = "structural"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "Equals the 935 list_id=3 rows exactly among players with a team; also set on 97 league-less free agents with no team, who hold no rows and are excluded by the assignment filter."

[[field]]
name = "roster_status_active"
source = "players.dat"
walker = "ootp_ai.parser.rosters.read_rosters"
type = "bit 2 of the status byte"
category = "structural"
epistemic = "verified"
validator = "cross-check-vs-multiplicity-solve"
note = "Set exactly on organisation-top-club active-roster players (the 30x26). Redundant with the multiplicity solve at those clubs and kept as a hard cross-check — 959/956/2,639 agreements across the three saves, zero disagreements, and a planted IL-bit mutation is caught by it. NOT set for minor-league active players, which is why it cannot replace the array."

[[field]]
name = "roster_status_sixty_day"
source = "players.dat"
walker = "ootp_ai.parser.rosters.read_rosters"
type = "bit 5 of the status byte"
category = "structural"
epistemic = "verified"
validator = "population-exact"
note = "Equals the 58-player 60-day-IL population the plan measured, exactly. Decoded knowledge, not consumed: the 60-day placement already shows as injured-without-secondary. Bits 0, 1, 6, 7 of this byte are observed but unclassified (bit 6 on 12 records, bit 7 on 9, all league-less or MLB oddities) and are not consulted."

[[field]]
name = "unrostered_assignment_marker"
source = "players.dat"
walker = "ootp_ai.parser.rosters.read_rosters"
type = "last_organization_id != 0 (assignment mask bit 3), with status byte 0x00"
category = "structural"
epistemic = "measured"
validator = "signature-match-or-refuse"
note = "DAY-0 BOUNDARY, handled by refusal. The 176 assigned-but-unrostered players (the export's negative league_id population) all carry last_organization_id == their own organisation and last_league_id == 234; zero of the 7,370 rostered players carry any last_organization_id. That separates them perfectly in all three saves on disk — but after the league trades a player across organisations, rostered players with the marker will exist. The walker therefore accepts an m==1 player only when he matches exactly one of the two measured signatures and REFUSES otherwise, so the marker breaking produces a loud AmbiguousRosterMembership, not a silent wrong roster. The residual risk it cannot catch: a future m==1 player matching a measured signature with a different truth (e.g. a traded, rostered, inactive minor leaguer). Re-measure at the first post-transaction snapshot."

[[field]]
name = "identity_to_status_spans"
source = "players.dat"
walker = "ootp_ai.parser.rosters.read_rosters"
type = "13 + 4 + 5 bytes between historical_team_id and the status byte"
category = "rating-true"
epistemic = "measured"
validator = "fixed-width-implied-by-exact-bit-match"
note = "Crossed, not interpreted. The middle 4 are the prone_overall/leg/back/arm quad (byte-exact on all 18,072 rows, per the position/role note below); the 13 before and 5 after are unclassified. That the whole span is fixed-width on every record of every save is implied by the status bits matching at a constant distance on all 18,072 scorable rows."

# ── names.dat, the string table ──────────────────────────────────────────────
#
# Phase 7. The walk is STRICT: zero residual on all three saves, and it frames exactly
# the 264,095 records the header declares. There is ONE index space, not two — the
# question the plan pre-registered as a silent-collision risk. Three measurements:
# index == position+1 for every record with no reset; both player slots resolve against
# this one table at 18,072/18,072; and 510 indices are used as a first name by one
# player and a last name by another, with both readings correct.

[[field]]
name = "name_index"
source = "names.dat"
walker = "ootp_ai.parser.names.read_names"
type = "u32"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "The key players.dat points with. Monotonic 1..264,095 across the whole file, one space, ENFORCED by read_names rather than merely observed — a repeated index would collapse the table last-write-wins and hand every player pointing there a confident wrong name, with the strict tier still reporting success. Grain note for Phase 8: bronze_name is keyed (save_id, sim_date, ingest_seq, name_space, name_index) as pre-registered, with name_space taking the single literal value 'all' — correct under both the one-space and two-space outcomes, and one-space is what was measured."

# GRAIN DECISION for Phase 8, taken 2026-08-18 by the operator rather than inherited,
# because Phase 7 produced the measurement that makes it worth a second look.
#
# bronze_name KEEPS the full per-snapshot key every other bronze table uses. That lands
# 264,095 rows per snapshot — roughly 14x the combined row count of bronze_player,
# bronze_team_roster and bronze_team — restated on every ingest across a simmed season.
# The volume is KNOWINGLY ACCEPTED: uniform bronze grain and snapshot immutability are
# worth more than the disk, and a reference table keyed differently from its neighbours
# is a special case every later query has to remember.
#
# What makes this a decision rather than an inheritance: the name table is measured to be
# static. All three saves' record bodies are BYTE-IDENTICAL, so a snapshot key restates
# unchanged data by design, not by accident. The named fallback, if snapshot size ever
# becomes a real problem, is to key bronze_name on the table's content digest and land
# one row set per distinct name master — deferred, not rejected.

[[field]]
name = "name_text"
source = "names.dat"
walker = "ootp_ai.parser.names.read_names"
type = "u32-length-prefixed bytes, no terminator, decoded latin-1"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "Resolves both player slots exactly on all 18,072 export rows. Encoding is latin-1: 1,621 of 264,095 entries carry a byte above 0x7f, so strict ASCII would raise on them. cp1252 scores identically on every name any player carries — the two readings disagree on exactly one entry in the table (index 259,322), which is already-corrupt mojibake in OOTP's shipped data and wrong under both. latin-1 wins on being total: it never raises, so an unseen byte cannot turn a landing into a crash. NOTE players.csv is NOT an exact answer key here — it ships pure ASCII with every accent already replaced by '?'."

[[field]]
name = "name_category"
# WHY A NAME BYTE IS FILED AS A RATING, since Phase 8b persists this label into
# `bronze_field_label` where a reader will meet it without this file open. It is not a
# rating and nothing here thinks it is. `rating-true` is what CLAUDE.md's corollary to
# ADR 0012 assigns to an UNCLASSIFIED field — "probably fine" is not a classification —
# so the category is doing withhold-by-default duty rather than describing the byte. The
# alternative, a distinct `unclassified` member of the category vocabulary, is a change to
# the serving gate's posture and belongs to whoever revisits ADR 0012, not to a loader.
source = "names.dat"
walker = "ootp_ai.parser.names.read_names"
type = "u8, leading each record"
category = "rating-true"
epistemic = "unconfirmed"
validator = "none"
note = "WITHHELD as unclassified, per the withhold-by-default rule. Takes 0x07 (225,171), 0x27 (33,954), 0x0f (4,234), 0x37 (584), 0x17 (152) and sits in contiguous blocks — 1..31,876 is 0x27 and 31,877..252,899 is 0x07, which look exactly like a given-name block and a surname block. That reading is REFUTED: of the indices players use as a LAST name, 6,668 point at 0x27 records. So it is not a first/last discriminator and nothing joins on it. Recorded because the plausible reading is the trap. Also load-bearing structurally: this byte LEADS its record. Read as a trailing separator the walk finds 264,094 records with 8 bytes left over, and mis-stops at index 31,877 — the Dutch surname \"'t Hart\", whose first character is an apostrophe (0x27), the same value the byte takes."

[[field]]
name = "name_usage_pairs"
source = "names.dat"
walker = "ootp_ai.parser.names.read_names"
type = "u32 count, then count x (u32, u32)"
category = "rating-true"
epistemic = "unconfirmed"
validator = "none"
note = "WITHHELD as unclassified. Consumed because strict byte accounting requires it, exposed because a walk that silently dropped a variable-length region could not claim strict, and read by nothing. The first element of each pair ranges 0-40 over 41 distinct values, which is name-origin-group shaped rather than nation-shaped (the world holds ~206 nations); the second is plausibly a frequency weight. Neither is confirmed and neither is needed for the join."

[[field]]
name = "names_declared_record_count"
source = "names.dat"
walker = "ootp_ai.parser.names.read_names"
type = "u32, header tail field 4"
category = "structural"
epistemic = "measured"
validator = "framed-count-equals-declared"
note = "264,095 in all three saves, and the walk frames exactly that many with zero residual. Unlike players.dat — which declares the 0xFFFFFFFF sentinel and therefore has no in-file oracle — this file carries a real count, which is what lets the strict tier be checked against something other than itself. Deliberately `measured` and NOT `verified`: `verified` in this file means scored against an INDEPENDENT answer key, and this field is cross-checked only against the same file's own record framing. Self-consistency is strong evidence and it is not an independent source; the export carries no names.dat row count to check it against."

[[field]]
name = "name_table_save_ownership"
source = "names.dat"
walker = "ootp_ai.parser.names.build_name_table"
type = "structural constraint, not a field"
category = "structural"
epistemic = "measured"
validator = "no-module-level-cache"
note = "The plan expected three saves to hold three different tables and asked for a resolver whose cache key includes save_id. MEASURED, and it refutes that premise: all three names.dat files are 8,642,110 bytes with three DIFFERENT SHA-256 digests, but their record bodies are BYTE-IDENTICAL — all 264,095 index->string mappings agree exactly. The digests differ only in the header, at the league sim date (byte 75) and the wall-clock write time (bytes 99-110). The structural rule is kept anyway and in its stronger form: names.py holds no cache at all, and a NameTable carries the save_id it was built from, so a table can only be applied by a caller naming both. Identity across today's three saves is a fact about shipped data, not an invariant — a patch, a mod or a custom name master would break it, and the failure it would produce is a roster full of confident wrong names with nothing raised."

# ── teams.dat, the club record (Phase 8a backfill) ───────────────────────────
#
# Landed in Phase 5 and declared here in Phase 8a, which is the gap `[meta].incomplete`
# used to name. Twelve of these were scored against ALL 259 rows of `ootp_truth_real.teams`
# by `tests/test_parse_real_save.py::test_every_parsed_team_matches_the_export_field_by_field`;
# the four the export does not carry say so and stay `measured`.
#
# The entries are prefixed `team_` because this file's names are unique across every
# source, and `players.dat` already holds a `team_id`, `league_id`, `sub_league_id` and
# `nation_id` meaning the PLAYER's. Two fields called the same thing from two files is
# exactly how a loader lands one where the other belongs.
#
# THE ENCODING IS DROP-ZERO: a record omits a field entirely when its value is falsy, so
# these fields sit at offsets that move from record to record. `parser/teams.py` carries
# the full argument; the consequence for anyone reading this file is that no offset here
# is a constant.

[[field]]
name = "team_record_id"
