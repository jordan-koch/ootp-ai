note = "`TeamRecord.city`. Compared against the export's `teams.name` on every record that carries one; the 26 that do not are the minor-league All-Star sides, and their absence is asserted separately by count rather than compared, because the export renders that absence as the club's display name and a direct comparison would fail on a CORRECT parse. Lands `None`, never `\"\"` — the writer drops a falsy slot, so an empty string and an absent one are indistinguishable on disk and \"not present\" is the only reading that asserts nothing the bytes never said."

[[field]]
name = "team_abbr"
source = "teams.dat"
walker = "ootp_ai.parser.teams.read_teams"
type = "string (u32 length + ASCII), slot 2 of 5"
category = "identity"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "`TeamRecord.abbr`. The thirty MLB abbreviations of real baseball are asserted by content and not merely by count — thirty wrong strings also count to thirty."

[[field]]
name = "team_nickname"
source = "teams.dat"
