note = "THE INTEGER IS VERIFIED; THE MEANING IS NOT. It matches the export's column exactly on all 3,058 rows, and the enum's semantics are undocumented — `db_structure_ootp25_mysql.txt` has the column, not the meaning. So it lands raw and NO HUMAN LABEL MAY BE ATTACHED to it, by the same rule Phase 6 applied to `list_id`: a wrong label produces a confidently wrong calendar that throws nothing. The epistemic label here describes the mapping, which is what this file's labels always describe; the label ban lives with the report layer."

