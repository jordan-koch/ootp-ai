category = "structural"
epistemic = "measured"
validator = "export-exact-all-rows"
note = "`TeamRecord.human_team`. DELIBERATELY `measured` AND NOT `verified`, corrected at the Phase 8a panel: the parsed column matches the export's `human_team` on all 259 rows, but `parser/teams.py` records that the slot is either `human_team` or `human_id` and BOTH EXPORT COLUMNS ARE 1 on the single managed club and 0 everywhere else — so the answer key cannot separate the two readings, and 18 field orders fit the observed bytes equally well. An oracle that cannot discriminate is not an answer key for that distinction; the same reasoning is applied to `world_league_head`. A save with two human managers would settle it. At most one club per save carries the flag, which is both a constraint the walk uses to disambiguate and the answer to \"which club do we manage\" — cross-checked against `human_managers.dat`, and the two agree on all three saves."

[[field]]
name = "team_level"
source = "teams.dat"
walker = "ootp_ai.parser.teams.read_teams"
type = "u32 immediately after the three colours"
category = "structural"
epistemic = "verified"
validator = "export-exact-all-rows"
note = "Never zero — 259 of 259 — so it is never dropped. Gives the direction of the organisation link: level decides which of two mutually-linked clubs is the parent."

[[field]]
name = "team_parent_id"
source = "teams.dat"
walker = "ootp_ai.parser.teams.read_teams"
type = "derived from the drop-zero u32 organisation-link array"
category = "identity"
epistemic = "verified"
validator = "mutual-link-agreement"
note = "`TeamRecord.parent_team_id`, and it reproduces the export's column for all 259 rows WITHOUT consulting the export: the link array is one array with two meanings — a club lists its affiliates, an affiliate lists its parent — and nothing in the bytes says which, so the parent is taken only where both records agree (b in a's links AND a in b's), with `level` giving the direction. The mutual test is also what discards the spurious links the array's soft end swallows (only ever 1 and 257, measured, neither of which points back). 0 means \"no parent\" on all 34 top-level clubs and it is a VALUE, not structural absence — this field and `team_level` are not optional, which is the opposite of the rule that governs the string slots."

[[field]]
