# Table declarations — the grain, the key and the coverage of every table bronze lands.
#
# TRACKED, and legitimately so: a grain we derived is our observation, not Out of the Park
# Developments' data (ADR 0006). This file carries no game data — table shapes, key lists
# and counts only.
#
# ── why this file exists at all ───────────────────────────────────────────────
#
# `.claude/agents/data-engineer.md` requires that a dataset "states its grain in prose AND
# enforces it with a uniqueness test, and the two must AGREE". Two copies of a fact drift;
# the only way they cannot is if there is one copy with more than one consumer. So the
# prose sentence, the key list and the emitted DDL all come from HERE:
#
#   * `warehouse/ddl.py`        emits CREATE TABLE + PRIMARY KEY from this file
#   * `tests/test_grain_contracts.py`  asserts the prose grain equals the emitted key
#   * `catalog/generate.py`     (Phase 11) renders the catalog's structural half
#
# ── how the prose is checked against the key, which is the point ──────────────
#
# `grain` is a sentence of the form "one row per A per B per C". `contracts/loader.py`
# splits it on " per ", resolves each dimension through [meta.dimensions] below, and
# requires the union of those columns to equal `key` EXACTLY. A key that drifts from its
# sentence — or a sentence that drifts from its key — fails to load, in every consumer, at
# import time. That is what makes the agreement structural rather than aspirational.
#
# The failure this is aimed at is specific and has a name: keying `bronze_team_roster` on
# (sim_date, player_id) instead of (team_id, player_id, list_id). A player sits on more
# than one club's lists at once — measured, 935 of them do — so the wrong key silently
# collapses those rows and the roster report loses players with nothing raised.

[meta]
schema_version = 1
updated = "2026-08-19"
phase = "first-sight Phase 8b (bronze landing, the ingest run, and the first ingest)"
tables_declared = 8
# Phase 8b corrected four coverage statements against what the first ingest actually
# landed. Three of them described "each save" from numbers only two saves had been
# measured on, and the managed league is the larger of the three — 337 clubs and 22,046
# players against the probes' 259 and 18,077. A coverage statement that is right about the
# development target and wrong about the club we manage is the exact shape of the error
# this project treats as worse than a gap.

# Every bronze key carries the universe, the in-game date, and which attempt at that date
# (§2.3(d) of the plan). `sim_date` is the LEAGUE's date, never wall-clock: you snapshot
# when you sim, and keying on wall-clock would fragment one game state across re-runs.
# `ingest_seq` separates two states of the SAME sim date — the operator executes an action
# without simming and wants to prove it landed — and it is what keeps the store append-only
# instead of overwriting.
[meta.dimensions]
save = ["save_id"]
snapshot = ["sim_date", "ingest_seq"]
team = ["team_id"]
club = ["team_id"]
player = ["player_id"]
"roster list" = ["list_id"]
"name-table entry" = ["name_space", "name_index"]
division = ["league_id", "sub_league_id", "division_id"]
"calendar event" = ["seq"]
"landed column" = ["table_name", "column_name"]
"ingest attempt" = ["save_id", "sim_date", "ingest_seq"]

# The closed vocabulary of column types. Nothing in this file carries SQL text: a
# declaration that could name its own MySQL type could also name a subquery, and
# `warehouse/ddl.py` would be interpolating strings into DDL. It maps these tokens to
# types itself, and refuses one it does not know.
[vocabulary]
type = [
    "u8",
    "u16",
    "u32",
    "i32",
    "bool01",
    "date",
    "text",
    "digest64",
    "json",
    "seconds",
    "bytes",
    "timestamp_utc",
]
# `bool01` is a 0/1 integer and NOT a boolean, deliberately, mirroring `parser/world.py`:
# every observed value is 0 or 1, but `bool(2)` is `True`, so a boolean column makes an
# unexpected value indistinguishable from a 1 forever.
collation = ["utf8mb4_bin", "utf8mb4_0900_ai_ci"]
# Name-bearing tables take `utf8mb4_bin`. The schemas are created
# `utf8mb4_0900_ai_ci` — accent- AND case-insensitive — so an "exact" comparison run in
# SQL scores `Ramírez == Ramirez` as a match, in a repo whose own export doc turns
# *Replace accents* Off precisely because it breaks validation against `names.dat`.

